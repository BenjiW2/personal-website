<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇺🇸 Star-Spangled Sips — 4th of July Drink Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Bungee&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0b1533;
    --navy-2: #131f47;
    --navy-3: #1b2a5e;
    --red: #e0162b;
    --red-bright: #ff3b4e;
    --white: #ffffff;
    --cream: #f4f1e8;
    --gold: #ffd35c;
    --blue-glow: #4d7cff;
    --muted: #93a0c7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--navy);
    color: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---- starfield background ---- */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(255,255,255,.8) 50%, transparent 51%),
      radial-gradient(1px 1px at 28% 62%, rgba(255,255,255,.55) 50%, transparent 51%),
      radial-gradient(2px 2px at 44% 30%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 61% 74%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 73% 12%, rgba(255,255,255,.8) 50%, transparent 51%),
      radial-gradient(1px 1px at 85% 48%, rgba(255,255,255,.6) 50%, transparent 51%),
      radial-gradient(2px 2px at 92% 82%, rgba(255,255,255,.65) 50%, transparent 51%),
      radial-gradient(1px 1px at 8% 88%, rgba(255,255,255,.5) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 52% 92%, rgba(255,255,255,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 38% 8%, rgba(255,255,255,.6) 50%, transparent 51%);
    animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }

  /* ---- flag stripe bars ---- */
  .stripes {
    height: 14px;
    background: repeating-linear-gradient(
      90deg,
      var(--red) 0 60px,
      var(--white) 60px 120px
    );
    position: relative;
    z-index: 2;
  }
  .stripes.bottom { position: fixed; bottom: 0; left: 0; right: 0; }

  .page {
    position: relative;
    z-index: 1;
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 90px;
  }

  /* ---- header ---- */
  header { text-align: center; margin-bottom: 28px; }

  .flags { font-size: 28px; letter-spacing: 6px; }

  h1 {
    font-family: 'Rye', 'Bungee', cursive;
    font-size: clamp(30px, 6vw, 56px);
    line-height: 1.1;
    margin: 8px 0 4px;
    color: var(--white);
    text-shadow:
      3px 3px 0 var(--red),
      6px 6px 0 rgba(224, 22, 43, .35),
      0 0 30px rgba(77, 124, 255, .5);
    letter-spacing: 1px;
  }

  .tagline {
    color: var(--muted);
    font-weight: 600;
    font-size: 15px;
  }
  .tagline .total {
    color: var(--gold);
    font-weight: 800;
  }

  /* ---- mission: 250 ---- */
  .mission {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 20px;
    margin-bottom: 22px;
    align-items: center;
  }
  @media (max-width: 700px) { .mission { grid-template-columns: 1fr; } }

  .mission-label {
    font-family: 'Bungee', cursive;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }
  .mission.done .mission-label { color: var(--gold); }

  .hero {
    font-size: 52px;
    font-weight: 800;
    color: var(--white);
    line-height: 1;
    margin-bottom: 12px;
  }
  .hero .hero-target { font-size: 24px; font-weight: 700; color: var(--muted); }

  .meter {
    position: relative;
    height: 20px;
    border-radius: 6px;
    background: #0c1637;
    overflow: hidden;
  }
  .meter-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(180deg, var(--red-bright), var(--red));
    border-radius: 0 4px 4px 0;
    transition: width .6s cubic-bezier(.2,.8,.3,1);
  }
  .mission.done .meter-fill { background: linear-gradient(180deg, #ffe08a, var(--gold)); }
  .meter .tick {
    position: absolute;
    top: 0; bottom: 0;
    width: 2px;
    background: var(--navy-2);
  }
  .meter-sub {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }

  .mission-clock {
    text-align: center;
    border-left: 2px solid var(--navy-3);
    padding-left: 20px;
  }
  @media (max-width: 700px) {
    .mission-clock { border-left: none; padding-left: 0; border-top: 2px solid var(--navy-3); padding-top: 16px; }
  }
  .clock-label {
    font-family: 'Bungee', cursive;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .clock {
    font-size: 42px;
    font-weight: 800;
    color: var(--white);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .pace {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
    min-height: 18px;
  }

  /* ---- add player bar ---- */
  .add-bar {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 22px auto 30px;
    max-width: 460px;
  }
  .add-bar input {
    flex: 1;
    padding: 13px 16px;
    border-radius: 12px;
    border: 2px solid var(--navy-3);
    background: var(--navy-2);
    color: var(--white);
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    outline: none;
    transition: border-color .15s;
  }
  .add-bar input::placeholder { color: var(--muted); font-weight: 500; }
  .add-bar input:focus { border-color: var(--blue-glow); }

  .btn-recruit {
    padding: 13px 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(180deg, var(--red-bright), var(--red));
    color: var(--white);
    font-family: 'Bungee', cursive;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 4px 0 #9c0f1e;
    transition: transform .08s, box-shadow .08s;
  }
  .btn-recruit:active { transform: translateY(3px); box-shadow: 0 1px 0 #9c0f1e; }

  /* ---- layout ---- */
  .columns {
    display: grid;
    grid-template-columns: 1.35fr 1fr;
    gap: 22px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .columns { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--navy-2);
    border: 2px solid var(--navy-3);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }

  .panel h2 {
    font-family: 'Bungee', cursive;
    font-size: 18px;
    letter-spacing: 1px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel h2 .rule {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    background: repeating-linear-gradient(90deg, var(--red) 0 14px, var(--white) 14px 28px, var(--navy-3) 28px 42px);
    opacity: .7;
  }

  /* ---- leaderboard rows ---- */
  .lb-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 14px;
    background: var(--navy-3);
    border: 2px solid transparent;
    margin-bottom: 10px;
    transition: transform .25s ease, border-color .25s;
  }
  .lb-row:last-child { margin-bottom: 0; }

  .lb-row.top {
    background: linear-gradient(135deg, #2a2158, var(--navy-3));
    border-color: var(--gold);
    box-shadow: 0 0 22px rgba(255, 211, 92, .25);
  }

  .rank {
    font-family: 'Bungee', cursive;
    font-size: 20px;
    width: 38px;
    text-align: center;
    flex-shrink: 0;
  }

  .lb-name { flex: 1; min-width: 0; }
  .lb-name .who {
    font-weight: 800;
    font-size: 17px;
    color: var(--white);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-name .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 800;
    color: var(--navy);
    background: var(--gold);
    border-radius: 20px;
    padding: 2px 9px;
    margin-top: 3px;
    letter-spacing: .4px;
  }

  .count {
    font-family: 'Bungee', cursive;
    font-size: 24px;
    color: var(--gold);
    min-width: 44px;
    text-align: right;
    flex-shrink: 0;
  }
  .count small {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .drink-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .drink-btns button {
    font-size: 20px;
    width: 42px;
    height: 42px;
    border-radius: 11px;
    border: 2px solid var(--navy-2);
    background: var(--navy);
    cursor: pointer;
    transition: transform .08s, background .15s, border-color .15s;
    line-height: 1;
  }
  .drink-btns button:hover { border-color: var(--blue-glow); background: #101c45; }
  .drink-btns button:active { transform: scale(.86); }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 26px 10px;
    font-weight: 600;
    line-height: 1.6;
  }
  .empty .big { font-size: 34px; display: block; margin-bottom: 6px; }

  /* ---- recent feed ---- */
  .feed-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--navy-3);
    margin-bottom: 8px;
    animation: slideIn .3s ease;
  }
  .feed-item:last-child { margin-bottom: 0; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feed-emoji {
    font-size: 24px;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    background: var(--navy);
    border-radius: 10px;
    flex-shrink: 0;
  }
  .feed-text { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; }
  .feed-text b { color: var(--white); }
  .feed-text .verb { color: var(--muted); }
  .feed-time { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }

  .feed-undo {
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 15px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .feed-undo:hover { color: var(--red-bright); background: rgba(224,22,43,.12); }

  /* ---- confetti ---- */
  .confetti {
    position: fixed;
    top: -12px;
    z-index: 50;
    pointer-events: none;
    border-radius: 2px;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    margin-top: 34px;
    letter-spacing: .5px;
  }
</style>
</head>
<body>

<div class="stars"></div>
<div class="stripes"></div>

<div class="page">
  <header>
    <div class="flags">🎆 🇺🇸 🎆</div>
    <h1>Star-Spangled Sips</h1>
    <p class="tagline">4th of July Drink Tracker · <span class="total" id="totalLine">0 drinks for America</span> 🦅</p>
  </header>

  <section class="panel mission" id="mission">
    <div>
      <div class="mission-label" id="missionLabel">🎯 Team Mission · 250 Drinks by Midnight</div>
      <div class="hero"><span id="heroCount">0</span><span class="hero-target"> / 250</span></div>
      <div class="meter">
        <div class="meter-fill" id="meterFill"></div>
        <div class="tick" style="left:25%"></div>
        <div class="tick" style="left:50%"></div>
        <div class="tick" style="left:75%"></div>
      </div>
      <div class="meter-sub"><span id="pctLine">0% there</span><span id="togoLine">250 to go</span></div>
    </div>
    <div class="mission-clock">
      <div class="clock-label">⏰ Countdown to Midnight</div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="pace" id="paceLine"></div>
    </div>
  </section>

  <form class="add-bar" id="addForm">
    <input type="text" id="nameInput" placeholder="Add a patriot…" maxlength="24" autocomplete="off">
    <button type="submit" class="btn-recruit">🗽 Recruit</button>
  </form>

  <div class="columns">
    <section class="panel">
      <h2>🏆 Leaderboard <span class="rule"></span></h2>
      <div id="leaderboard"></div>
    </section>

    <section class="panel">
      <h2>🔔 Latest Sips <span class="rule"></span></h2>
      <div id="feed"></div>
    </section>
  </div>

  <footer>DRINK RESPONSIBLY, PATRIOTS · EST. JULY 4TH · 🇺🇸</footer>
</div>

<div class="stripes bottom"></div>

<script>
  const STORAGE_KEY = 'july4-drink-tracker';
  const GOAL = 250;
  // fixed at page load: the upcoming midnight
  const MIDNIGHT = (() => { const d = new Date(); d.setHours(24, 0, 0, 0); return d.getTime(); })();
  const DRINKS = [
    { type: 'Beer',     emoji: '🍺', verb: 'cracked a cold' },
    { type: 'Seltzer',  emoji: '🥫', verb: 'popped a' },
    { type: 'Cocktail', emoji: '🍹', verb: 'mixed up a' },
    { type: 'Shot',     emoji: '🥃', verb: 'fired off a' },
  ];
  const RANK_ICONS = ['🥇', '🥈', '🥉'];

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed.players) && Array.isArray(parsed.drinks)) return parsed;
      }
    } catch (e) { /* corrupted storage — start fresh */ }
    return { players: [], drinks: [] };
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  function timeAgo(ts) {
    const s = Math.floor((Date.now() - ts) / 1000);
    if (s < 45) return 'just now';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    return h + 'h ago';
  }

  // ---- actions ----
  function addPlayer(name) {
    name = name.trim();
    if (!name) return;
    if (state.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
      alert(name + ' is already enlisted! 🫡');
      return;
    }
    state.players.push({ id: crypto.randomUUID(), name });
    save();
    render();
  }

  function logDrink(playerId, drinkIdx) {
    const before = state.drinks.length;
    state.drinks.push({
      id: crypto.randomUUID(),
      playerId,
      drink: drinkIdx,
      ts: Date.now(),
    });
    save();
    render();
    launchConfetti(before < GOAL && state.drinks.length >= GOAL ? 180 : 32);
  }

  function undoDrink(drinkId) {
    state.drinks = state.drinks.filter(d => d.id !== drinkId);
    save();
    render();
  }

  // ---- render ----
  function render() {
    renderTotal();
    renderMission();
    renderLeaderboard();
    renderFeed();
  }

  function renderMission() {
    const n = state.drinks.length;
    const pct = Math.min(100, (n / GOAL) * 100);
    document.getElementById('heroCount').textContent = n;
    document.getElementById('meterFill').style.width = pct + '%';
    document.getElementById('pctLine').textContent = Math.floor(pct) + '% there';
    document.getElementById('togoLine').textContent = n >= GOAL ? '🎆 GOAL SMASHED' : (GOAL - n) + ' to go';

    const done = n >= GOAL;
    document.getElementById('mission').classList.toggle('done', done);
    document.getElementById('missionLabel').textContent = done
      ? '🎆 MISSION ACCOMPLISHED, AMERICA! 🎆'
      : '🎯 Team Mission · 250 Drinks by Midnight';
    updatePace();
  }

  function updatePace() {
    const el = document.getElementById('paceLine');
    const n = state.drinks.length;
    const msLeft = MIDNIGHT - Date.now();
    if (n >= GOAL) { el.textContent = '🦅 Goal crushed — freedom achieved'; return; }
    if (msLeft <= 0) { el.textContent = (GOAL - n) + ' short of glory. Hydrate, patriots.'; return; }
    const pace = (GOAL - n) / (msLeft / 3600000);
    el.textContent = 'Pace to hit it: ' + (pace >= 100 ? Math.ceil(pace) : pace.toFixed(1)) + ' drinks/hr';
  }

  function tickClock() {
    const el = document.getElementById('clock');
    const ms = MIDNIGHT - Date.now();
    if (ms <= 0) {
      el.textContent = '🎆 00:00:00';
      updatePace();
      return;
    }
    const s = Math.floor(ms / 1000);
    const pad = x => String(x).padStart(2, '0');
    el.textContent = pad(Math.floor(s / 3600)) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
    updatePace();
  }

  function renderTotal() {
    const n = state.drinks.length;
    document.getElementById('totalLine').textContent =
      n + (n === 1 ? ' drink' : ' drinks') + ' for America';
  }

  function renderLeaderboard() {
    const el = document.getElementById('leaderboard');

    if (!state.players.length) {
      el.innerHTML = '<div class="empty"><span class="big">🗽</span>No patriots yet.<br>Recruit someone above to start the party!</div>';
      return;
    }

    const counts = {};
    for (const d of state.drinks) counts[d.playerId] = (counts[d.playerId] || 0) + 1;

    const ranked = [...state.players].sort((a, b) =>
      (counts[b.id] || 0) - (counts[a.id] || 0) || a.name.localeCompare(b.name)
    );

    el.innerHTML = ranked.map((p, i) => {
      const n = counts[p.id] || 0;
      const isTop = i === 0 && n > 0;
      const rank = RANK_ICONS[i] || (i + 1);
      const btns = DRINKS.map((d, di) =>
        `<button title="Log ${d.type}" onclick="logDrink('${p.id}', ${di})">${d.emoji}</button>`
      ).join('');
      return `
        <div class="lb-row${isTop ? ' top' : ''}">
          <div class="rank">${rank}</div>
          <div class="lb-name">
            <div class="who">${esc(p.name)}</div>
            ${isTop ? '<span class="badge">🦅 TOP PATRIOT</span>' : ''}
          </div>
          <div class="drink-btns">${btns}</div>
          <div class="count">${n}<small>DRINKS</small></div>
        </div>`;
    }).join('');
  }

  function renderFeed() {
    const el = document.getElementById('feed');
    const recent = [...state.drinks].sort((a, b) => b.ts - a.ts).slice(0, 15);

    if (!recent.length) {
      el.innerHTML = '<div class="empty"><span class="big">🍻</span>No sips logged yet.<br>Tap a drink on the leaderboard!</div>';
      return;
    }

    const byId = Object.fromEntries(state.players.map(p => [p.id, p.name]));
    el.innerHTML = recent.map(d => {
      const drink = DRINKS[d.drink] || DRINKS[0];
      const name = byId[d.playerId] || '???';
      return `
        <div class="feed-item">
          <div class="feed-emoji">${drink.emoji}</div>
          <div class="feed-text"><b>${esc(name)}</b> <span class="verb">${drink.verb}</span> <b>${drink.type}</b></div>
          <div class="feed-time">${timeAgo(d.ts)}</div>
          <button class="feed-undo" title="Undo this drink" onclick="undoDrink('${d.id}')">✕</button>
        </div>`;
    }).join('');
  }

  // ---- red, white & blue confetti ----
  function launchConfetti(count = 32) {
    const colors = ['#e0162b', '#ffffff', '#4d7cff', '#ffd35c'];
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      const size = 6 + Math.random() * 7;
      c.style.width = size + 'px';
      c.style.height = size * (Math.random() > .5 ? 1 : 2.2) + 'px';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      document.body.appendChild(c);
      c.animate([
        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
        { transform: `translateY(${window.innerHeight + 40}px) rotate(${540 + Math.random() * 540}deg)`, opacity: .9 }
      ], {
        duration: 1400 + Math.random() * 1200,
        easing: 'cubic-bezier(.2,.6,.4,1)',
      }).onfinish = () => c.remove();
    }
  }

  // ---- wire up ----
  document.getElementById('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('nameInput');
    addPlayer(input.value);
    input.value = '';
    input.focus();
  });

  // keep "Xm ago" labels fresh
  setInterval(renderFeed, 30000);
  setInterval(tickClock, 1000);

  render();
  tickClock();
</script>
</body>
</html>
